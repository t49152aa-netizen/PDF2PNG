name: Build exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name pdf2png --exclude-module pymupdf.layout --exclude-module onnxruntime pdf2png_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2png-windows
          path: dist/pdf2png.exe
